<!--base.html-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Welcome to EdenAlfred</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='dist/assets/favicon.ico') }}" />
        <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{{ url_for('static', filename='dist/css/index.css') }}" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar-->
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">功能表</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('cover_page') }}" method="GET">query</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('pat_sc1.patient_page') }}">Patient</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('admin_get.patient_list') }}"  method="GET">Patient list</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('obs.obs_page') }}"  method="GET">Observation</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('obs_get.search_page2') }}"  method="GET">ECG</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('org.organization_page') }}"  method="GET">Organization</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('ser.service_page') }}"  method="GET">ServiceRequest</a>
                <a class="list-group-item list-group-item-action list-group-item-light p-3" href="{{ url_for('pra.practitioner_page') }}"  method="GET">Practitioner</a>
                
            </div>
        </div>
        <!-- Page content wrapper-->
        <div id="page-content-wrapper">
            <!-- Top navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="sidebarToggle">Toggle Menu</button>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                            <li class="nav-item active"><a class="nav-link" href="{{ url_for('cover_page') }}" method="GET">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="#!">Link</a></li>
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                                <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" href="#!">登入</a>
                                    <a class="dropdown-item" href="#!">註冊</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item" href="#!">登出</a>
                                </div>
                            </li>
                           
                            
                        
                        </ul>
                    </div>
                </div>
            </nav>
    
    <div class="content">
        {% block content %}
    </div>
    {% endblock %}
     <!-- Bootstrap core JS-->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
     <!-- Core theme JS-->
     <script src="{{ url_for('static', filename='dist/js/index.js') }}"></script>
     <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
</body>
</html>
