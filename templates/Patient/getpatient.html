{% extends "base.html" %}

{% block title %}病患基本資料{% endblock %}

{% block content %}    
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="input-group">
                            <span class="input-group-text">身分證字號</span>
                            <input type="text" class="form-control" name="search_text" placeholder="Search text">
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-info">Search</button>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>性別</th>
                            <th>身分證字號</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if data %}
                            {% for patient in data %}
                                <tr>
                                    <td>{{ patient[0] }}</td>
                                    <td>{{ patient[1] }}</td> 
                                    <td>{{ patient[2] }}</td>
                                    <td>
                                        <!-- Button -->
                                        <a href="{{ url_for('pat_get.detail', patient_id=patient[2]) }}" class="btn btn-success" target="_blank">查看</a>
                                    </td>
                                </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4">No data found.</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
