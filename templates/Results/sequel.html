<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <title>回應資訊</title>
</head>
<body>
    <h1>回應資訊</h1>
    
    <!-- 使用 <textarea> 顯示伺服器回傳的資訊 -->
    <div class="text-center mx-auto" style="width: 50%;">
    <textarea rows="20" cols="25" class="form-control mx-auto border border-Info border-5">{{ server_response_text }}</textarea>
        </div>
    
    <!-- 添加返回首頁的連結 -->
    <form action="{{ url_for('home_page') }}" method="GET">
    <div class="position-absolute top-30 start-50">
        <button type="submit" class="btn btn-primary">返回首頁</button>
    </form>    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>    
</body>
</html>
