{% extends "base.html" %}

{% block title %}心電圖檢測報告{% endblock %}

{% block content %} 

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form method="POST">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="input-group">
                            <span class="input-group-text">姓名</span>
                            <input type="text" class="form-control" name="search_text" placeholder="Search text">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="input-group">
                            <span class="input-group-text">病患id</span>
                            <input type="text" class="form-control" name="search_text1" placeholder="Search text">
                        </div>
                    </div>
                    <div class="col-md-auto mb-3">
                        <button type="submit" class="btn btn-info">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- 插入基本資料 -->
            <div class="card">
                <div class="card-header">基本資料</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p>姓名: Ivy</p>
                            <p>性別: 女</p>
                            <p>身分證字號: H123456789</p>
                        </div>
                        <div class="col-md-6">
                            <p>出生日期: 91/02/11</p>
                            <p>年齡: 22</p>
                            <p>檢查時間:2024-01-04 14:25:31</p>
                        </div>
                    </div>
                </div>
            </div>
            <p>心率: 72</p>
        </div>
    </div>
</div>

<!-- Core theme JS-->

<img src="{{ url_for('static',filename='ecg_plots.png') }}" alt="ECG Plot">
        
{% endblock %}
