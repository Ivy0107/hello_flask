{% extends "base.html" %}

{% block title %}
    心電圖檢測報告
{% endblock %}

{% block content %} 
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="input-group">
                                <span class="input-group-text">檢查單id</span>
                                <input type="text" class="form-control" name="search_text" placeholder="Search text">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="input-group">
                                <span class="input-group-text">病患id</span>
                                <input type="text" class="form-control" name="search_text1" placeholder="Search text">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="input-group">
                                <span class="input-group-text">數據代碼</span>
                                <input type="text" class="form-control" name="search_text2" placeholder="Search text">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="input-group">
                                <span class="input-group-text">時間</span>
                                <input type="text" class="form-control" name="search_text3" placeholder="Search text">
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-info">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Core theme JS-->
    <img src="{{ url_for('static',filename='ecg_plot.png') }}" alt="ECG Plot">
{% endblock %}
